# --- Final held-out configuration -- IMMUTABLE once evaluation begins --------------------
[final_holdout]
frozen = true
primary_source = "jhtdb_isotropic1024coarse_topology"
event_types = ["core_merger", "core_split"]
added_value_margin = 0.02
evaluations_allowed = 1
note = "Evaluated once after development is frozen and the saturation screen is applied. The report records this file's SHA-256."
