    role: separate_dynamic_recovery_and_comparative_protocol_partner
    constraints: [resolve_current_contract_not_stale_version_label, ITD_TDI_ablation, no_frozen_lineage_or_holdout_change]
  Memorithm/FLAT-ATTENTION:
    role: structured_operator_and_external_attention_reference_partner
    handoff: V888-BOOL-4.1
    constraints: [dense_reference_numerical_controls, preserve_negative_MAA_evidence, independent_kernel_and_device_qualification]
  Memorithm/NoiseLab:
