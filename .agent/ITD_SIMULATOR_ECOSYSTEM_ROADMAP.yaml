    handoff: V888-BOOL-2.1
  Memorithm/Forge:
    role: bounded_development_candidate_search
    handoff: V888-BOOL-3.0
    constraints: [ITD_retains_protocol_and_holdout_authority, frozen_domain_and_budget]
  Memorithm/ElasticXxx:
    role: downstream_adaptive_systems_research
    handoff: V888-BOOL-4.2
    candidate_questions: [representation, precision, memory, model_choice, compression, recomputation, controlled_adaptation]
    constraints: [shadow_first, no_automatic_policy_promotion, separate_Elastic_invariant_validation]
  Memorithm/SciRust-Verify:
    role: conditional_evidence_normalization
    constraints: [versioned_adapter_required, preserve_scientific_scope_and_negative_outcomes]
  Memorithm/scirust-hub:
    role: conditional_bounded_non_privileged_orchestration
    constraints: [versioned_adapter_required, no_inferred_live_capability]

