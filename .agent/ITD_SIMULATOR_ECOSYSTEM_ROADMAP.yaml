scientific_invariants:
  - ITD_V29_18_remains_frozen_and_is_not_revised_to_improve_benchmarks
  - software_release_research_programme_and_scientific_model_versions_are_distinct
  - Missions_3_through_8_negative_fluid_diagnostic_results_remain_closed_in_scope
  - isolated_one_way_dependency_from_research_to_frozen_core
  - competent_established_and_learned_controls_are_not_weakened
  - no_final_holdout_tuning_or_implicit_final_authorization
  - explicit_uncertainty_and_positive_negative_equivalent_inconclusive_blocked_outcomes
  - new_local_multiscale_graph_or_learned_representations_are_research_not_silent_ITD_revisions
  - domain_specific_assumptions_do_not_transfer_without_evidence
  - data_integrity_is_not_pairwise_graph_identity_or_functional_model_validation
  - binary_spikes_do_not_imply_Boolean_only_internal_arithmetic
  - encoder_readout_hidden_history_and_cross_trial_leakage_are_tested
  - synapse_multiplicity_is_not_conductance_and_unknown_signs_are_not_invented
  - adult_allometry_and_simulated_interventions_do_not_establish_biological_growth_causality
  - no_other_raw_connectome_added_without_separate_source_authorization
  - required_CI_green_on_exact_candidate_head_before_default_code_merge
  - intermediate_branch_merge_is_not_default_branch_integration

ownership:
  role: comparative_scientific_and_AI_experiment_laboratory
  owns:
