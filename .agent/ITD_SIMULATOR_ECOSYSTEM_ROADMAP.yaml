    - comparative_protocols_grouped_statistics_provenance_and_outcome_handling
    - isolated_AI_adapters_and_V888_Boolean_experiments
  does_not_own:
    - TDI_dynamic_recovery_semantics_or_frozen_results
    - SciRust_general_statistics_graph_event_or_numerical_primitive_ownership
    - SML_GENIUS_model_and_consumer_semantics
    - FLAT_ATTENTION_execution_kernel_or_mask_semantics
    - NoiseLab_perturbation_mechanisms
    - Forge_candidate_search_strategy
    - ElasticXxx_runtime_policy_or_actuation
    - SciRust_Verify_general_dossier_verdicts
    - Hub_global_orchestration

