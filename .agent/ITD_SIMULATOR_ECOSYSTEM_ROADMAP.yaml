    Reuse SciRust primitives and qualify explicit evidence handoffs to
    SML-GENIUS, TDI, FLAT-ATTENTION, NoiseLab, Forge, ElasticXxx, Verify and Hub.
    Evidence never transfers model-default, final-holdout or actuation authority.

