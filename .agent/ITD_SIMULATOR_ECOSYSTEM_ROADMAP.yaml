    Maintain ITD Research Lab as a frozen ITD V29.18 scientific reference plus
    a falsifiable V30+ AI/SciML, representation, trajectory, UQ and adaptive
    systems laboratory. Execute the new V888-BOOL programme in Rust on Thor
    without conflating data audits, model computation and biological growth.
