agent_operating_protocol:
  must_read_this_file:
    - every_session_start_and_next_major_task_selection
    - before_frozen_core_scientific_revision_or_confirmatory_work
    - before_cross_repository_integration_or_promotion
    - after_user_change_to_strategy
    - before_any_relevant_PR_or_merge_decision
  must_update_this_file:
    - when_strategy_phase_dependency_or_ownership_changes
    - when_a_confirmatory_protocol_or_result_is_frozen
    - when_an_implementation_is_integrated_or_rejected
    - when_a_new_dated_checkpoint_is_written
  must_not:
    - treat_conversation_memory_as_live_GitHub_status
    - report_plans_as_executed_work_or_tests_as_biological_results
    - ask_user_to_type_routine_commands_when_tools_can_execute
    - claim_unobserved_Thor_execution_or_background_work
    - put_credentials_raw_data_or_private_consumer_code_in_public_strategy
  fail_closed: >-
    Missing policy, required checkpoint, provenance or external authorization
    blocks major scientific-revision, confirmatory, cross-repository promotion
    and merge decisions. Read-only diagnosis and explicit blocker reports remain allowed.

# V0 holdout — Orchestrator must not AUTO_MERGE this repository.
autonomous_merge_policy:
  schema_version: 1
  decision: deny


