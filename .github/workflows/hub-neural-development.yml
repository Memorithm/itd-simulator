name: Hub ITD NeuralOperator Development exchange
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  real-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ITD_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Memorithm/scirust-hub
          ref: 01cf5f1e6d96573d57eef8d2aea22a5a8b0da02f
          path: hub-owner
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Exact build source and immutable library dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ITD_SOURCE_SHA"
          test "$(git -C hub-owner rev-parse HEAD)" = 01cf5f1e6d96573d57eef8d2aea22a5a8b0da02f
          cargo build --locked --manifest-path hub-owner/Cargo.toml -p scirust-hubd
      - name: Locked Rust source and contract gates
        working-directory: research-rs
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Actual HTTP daemon, artifact transfer and consumer execution
        working-directory: research-rs
        env:
          ITD_HUB_BINARY: ${{ github.workspace }}/hub-owner/target/debug/scirust-hubd
          ITD_BRIDGE_EVIDENCE: ${{ runner.temp }}/itd-neural-evidence
        run: cargo test --locked --test hub_e2e -- --ignored --nocapture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: itd-hub-neural-development-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/itd-neural-evidence
          if-no-files-found: error
